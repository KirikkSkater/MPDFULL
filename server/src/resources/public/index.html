    <style>
        
        table { 	margin-top: 50px; 
        /* Достаточно места для фиктивных заголовков */width: 200%; 	
        min-width: 2000px;
        overflow-x: auto;
        margin-bottom: 20px; 	
        border: 2px solid #dddddd; 
        border-collapse: collapse; 
        border-color: #000000;
        box-sizing:  border-box;
        table-layout: fixed;
        }
            
        a, a:visited{
        color: #0000EE;
        }

        
        table th {	font-weight: bold;	padding: 5px;	background: #efefef;	border: 1px solid #dddddd;border-color: #000000}
        table td {
        border: 1px solid #dddddd;
        padding: 5px;
        border-color: #000000}
        .editable {
            background-color: #f9f9f9;
        }
        .edit-mode input {
            width: 100%;
            box-sizing: border-box;
        }
        .data-table.disable {
            pointer-events: none; /* Disable all mouse events */
			cursor: not-allowed;
            opacity: 0.7; /* Make the table more gray */
        }
		
		.data-table.disable p.click_style{
            pointer-events: auto; /* Disable all mouse events */
            opacity: 1; /* Make the table more gray */
			cursor: pointer;
		}
		
        .hidden-row {
            display: none;
        }
        .compressed {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .bold-header {
            font-weight: bold;
            text-align: center;
            vertical-align: middle;
        }
        
        
    </style>

<body>

    <div id = "toolbar" role="toolbar" class="toolbar">
        <div class="text-group">
            
            <!-- Кнопка открытия панели -->
            <button class="button-toolbar" id="toggle-sidebar-btn">Применимости</button>
            <!-- <div style="margin-left: 12; margin-right: 0;">БЛГ:</div>
            <div id="awb-name-box-id" class="awb-name-box  notexist" style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">БЛГ</div>
            <div >связано с ТС:</div>
            <div  class="tc-name-box notexist" style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis;" id="tc-name-box-id">Таблица соответствия:</div> -->
        </div>

        <button id="select-dataset-btn" class="button-toolbar" type="button" title="Выбрать модуль данных" style="margin-right:8px;">
            Выбрать модуль данных
        </button>

        <div class="btn-group" role="group">
            <button disabled class="button-toolbar" id="preview-btn" type="button" title="Предпросмотр" style="margin-right: 5px; width: auto; padding-left: 4px; padding-right: 4px;">
                <img src="images/hidden.png" id="hidden-icon" type='icon 'class="icon icon-preview" style="display: none;">
                <img src="images/preview.png" id="preview-icon" type="icon" class="icon icon-preview" >    
            </button>

            

            <button disabled class="button-toolbar edit" id="edit-btn" type="button">Редактировать</button>
            <button disabled title="Отменить изменения" class="button-toolbar exit" id="exit-btn" type="button">Отмена</button>
        </div>
    </div>
    


    <div id="main-wrapper" style="display: flex; overflow-x: hidden; position: relative;">
        <div id="applic-sidebar" class="sidebar hidden"></div>

    </div>


    <!-- <div id="table-container"></div> -->
    <script src="src/core/XMLParser.js"></script>
    <script src="src/core/SheduledController.js"></script>
    <script src="src/core/HandlerTeamcenter.js"></script>
    <script src="src/core/ScheduleTableModel.js"></script>
    <script src="src/core/DModuleFactory.js"></script>
    <!-- <script src="src/view/TableObjectsCell.js"></script> -->
    <script src="src/view/Toolbar.js"></script>
    <script src="src/view/ScheduleView.js"></script>
    <script src="src/view/ApplicSidebar.js"></script>
    
    <script>
  (function() {
    // Ждём, пока jQuery станет доступен
    var parser  = new XMLParser();
    var factory = new DModuleFactory();
    var infoCode = '0B2A'; // Значение по умолчанию

    // Создаём handler для Teamcenter API (base URL по умолчанию '')
    var tcHandler = new HandlerTeamcenter(''); // если нужен префикс, укажи '/api' и т.д.
    window.tcHandler = tcHandler;

    // Контроллер (пока без XML)
    window.controller = new ScheduledController({
      parser: parser,
      factory: factory,
      modelClass: ScheduleTableModel,
      viewClass: ScheduleView,
      $container: $('#table-container'),
      infoCode: infoCode
    });

    // Хранилище текущего uid
    window.currentDatasetUid = null;

    // finishEditing: вызывается при подтверждении сохранения из toolbar
    window.finishEditing = async function (shouldSave) {
      if (!shouldSave) {
        console.log("Изменения отменены");
        return;
      }

      if (!window.currentDatasetUid) {
        alert('UID модуля данных не указан. Выберите модуль данных перед сохранением.');
        return;
      }

      try {
        const xmlToSave = window.controller && window.controller.exportXML ? window.controller.exportXML() : null;
        if (!xmlToSave) throw new Error('Нет XML для сохранения');

        // Вызов API сохранения
        $saveBtn.prop('disabled', true);
        // document.getElementById('save-dataset-btn').textContent = 'Сохранение...';

        await tcHandler.updateDataset(window.currentDatasetUid, xmlToSave);

        alert('Сохранено успешно');
      } catch (err) {
        console.error('Ошибка при сохранении dataset:', err);
        alert('Ошибка при сохранении: ' + (err.message || err));
      } finally {
        // document.getElementById('save-dataset-btn').textContent = 'Сохранить';
        $saveBtn.prop('disabled', false);
      }
    };

    

    // Кнопка: выбрать модуль данных (prompt UID)
    const $selectBtn = $('#select-dataset-btn');
    const $saveBtn = $('#save-dataset-btn');

    $selectBtn.on('click', async function() {
      const uid = prompt("Введите UID модуля данных (dataset uid):");
      if (!uid) return;

      try {
        $selectBtn.prop('disabled', true).text('Загрузка...');
        const xmlString = await tcHandler.getDataset(uid);

        // Инициализируем контроллер с полученным XML и включаем режим edit кнопки
        window.currentDatasetUid = uid;
        window.controller.init(xmlString);
        window.controller.bindToolbar();

        // Включаем кнопку Сохранить
        $saveBtn.prop('disabled', false);

      } catch (err) {
        console.error('Ошибка при загрузке dataset:', err);
        alert('Ошибка при загрузке данных: ' + (err.message || err));
      } finally {
        $selectBtn.prop('disabled', false).text('Выбрать модуль данных');
      }
    });

    // Кнопка сохранить — повесим на click — она вызывает window.finishEditing через confirm в toolbar flow
    $saveBtn.on('click', function() {
      // инициируем flow сохранения: показать confirm similar to edit toolbar
      var doSave = confirm('Отправить изменения в Teamcenter?');
      if (!doSave) return;
      // напрямую вызовем finishEditing(true)
      window.finishEditing(true);
    });

    const urlParams = new URLSearchParams(window.location.search);
    const uid = urlParams.get('uid');
    if(uid){
      try {
        tcHandler.getDataset(uid)
        .then(xmlString => {
            // Инициализируем контроллер с полученным XML
            window.currentDatasetUid = uid;
            window.controller.init(xmlString);
            window.controller.bindToolbar();
        })
        .catch(error => {
            console.error('Ошибка при загрузке dataset:', error);
            $selectBtn.prop('disabled', false).text('Ошибка');
        });

        // Включаем кнопку Сохранить
        $saveBtn.prop('disabled', false);

      } catch (err) {
        console.error('Ошибка при загрузке dataset:', err);
        alert('Ошибка при загрузке данных: ' + (err.message || err));
      } finally {
        $selectBtn.prop('disabled', false).text('Выбрать модуль данных');
      }
    }

    // Если нужно — можно также позволить загрузку тестового xml при старте (удалите/закомментируйте если не нужно)
    // fetch('xmls/DMC-RRJ-A-05-34-21-00A-0B2B-A_003-00_ru-RU.xml')
    //   .then(res => res.text())
    //   .then(xmlString => {
    //       window.controller.init(xmlString);
    //       window.controller.bindToolbar();
    //       // не включаем save (т.к. нет uid)
    //   }).catch(err => console.error('Ошибка при загрузке XML:', err));
        })();
    </script>

</body>
