    table {
      margin-top: 0px;
      width: 200%;

      scrollbar-width: auto !important; /* Для Firefox */

    #table-container::-webkit-scrollbar {
      width: 10px !important;
      height: 10px !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    #table-container::-webkit-scrollbar-track {
      background: #f1f1f1 !important;
      border-radius: 4px !important;
    }

    #table-container::-webkit-scrollbar-thumb {
      background: #888 !important;
      border-radius: 4px !important;
      border: 3px solid #f1f1f1 !important;
    }

    #table-container::-webkit-scrollbar-thumb:hover {
      background: #555 !important;
    }

    /* Убедитесь, что скроллбар не скрыт где-то в глобальных стилях */
    *::-webkit-scrollbar {
      display: block !important; /* Убрать если есть display: none */

    #table-container {
      scrollbar-color: #b9c4eb #e9ecef !important; /* Firefox */
    }

tbody td {
      /* border: 1px solid #000; */

    }

#table-container::-webkit-scrollbar-thumb {
  background-color: #a4a4a4 !important;

}

    table td {

<body>

  <!-- Панель загрузки/выгрузки -->

  <div id="toolbar" role="toolbar" class="toolbar compact-toolbar">
    <!-- Левая часть: кнопка Применимости + бейджи -->
    <div class="toolbar-left">
        <button class="btn btn-sm btn-outline-primary toolbar-blue" id="toggle-sidebar-btn">
            <span class="btn-text">Применимости</span>
        </button>
    </div>

    <!-- Правая часть: все остальные элементы -->
    <div class="toolbar-right">
        <input type="file" id="upload-xml" accept=".xml" style="display:none;">
        
        <button id="select-dataset-btn" class="btn btn-sm btn-outline-primary toolbar-blue" type="button" 
                title="Выбрать модуль данных">
            <span class="btn-text">Выбрать модуль</span>
        </button>
        
        <button id="upload-btn" class="btn btn-sm btn-outline-primary toolbar-blue" type="button">
            <span class="btn-text">Загрузить XML</span>
        </button>
        
        <button id="download-btn" class="btn btn-sm btn-outline-primary toolbar-blue" type="button">
            <span class="btn-text">Выгрузить XML</span>
        </button>
        
        <div class="info-code-box">
            <span class="info-label">Инфокод:</span>
            <span id="infoCodeId" class="info-value"></span>
        </div>
        
        <div class="toolbar-actions">
            <button disabled class="btn btn-sm btn-outline-primary preview-btn toolbar-blue" id="preview-btn" 
                    type="button" title="Предпросмотр">
                <img src="images/hidden.png" id="hidden-icon" class="icon icon-btn" style="display: none;">
                <img src="images/preview.png" id="preview-icon" class="icon icon-btn">
            </button>
            <button disabled class="btn btn-sm btn-outline-primary toolbar-blue edit" id="edit-btn" type="button">
                <span class="btn-text">Редактировать</span>
            </button>
            <button disabled class="btn btn-sm btn-outline-danger toolbar-red exit" id="exit-btn" 
                    type="button" title="Отменить изменения">
                <span class="btn-text">Отмена</span>
            </button>
        </div>
    </div>
</div>

  <script>
    (function () {

      $(document).ready(async function() {
        // Инициализируем оба менеджера данных параллельно
        const [zonesLoaded, accessPointsLoaded] = await Promise.all([
            window.zoneDataManager.init(),
            window.accessPointDataManager.init()
        ]);
        
        console.log('Зоны загружены:', zonesLoaded);
        console.log('Точки доступа загружены:', accessPointsLoaded);
        
        // // Затем инициализируем приложение
        // initScheduleTable();
    });

      var parser = new XMLParser();
      var factory = new DModuleFactory();
      var infoCode = '0B2A';

      const $selectBtn = $('#select-dataset-btn');
      const $saveBtn = $('#edit-btn');
      var tcHandler = new HandlerTeamcenter('http://localhost:9090/');
      window.tcHandler = tcHandler;

      tcHandler.getDicts("uiddict")
        .then(temp => DictionariesTC.load(temp))
        .catch(err => console.error("Ошибка загрузки:", err));

      window.controller = new ScheduledController({
        parser: parser,
        factory: factory,
        modelClass: ScheduleTableModel,
        viewClass: ScheduleView,
        $container: $('#table-container'),
        infoCode: infoCode
      });

      window.currentDatasetUid = null;

      window.finishEditing = async function (shouldSave) {
        if (!shouldSave) return;
        if (!window.currentDatasetUid) {
          alert('UID модуля данных не указан');
          return;
        }
        try {
        const xmlToSave = window.controller && window.controller.exportXML ? window.controller.exportXML() : null;
          if (!xmlToSave) throw new Error('Нет XML для сохранения');

        // Вызов API сохранения
        // $saveBtn.prop('disabled', true);
        // document.getElementById('save-dataset-btn').textContent = 'Сохранение...';

          await tcHandler.updateDataset(window.currentDatasetUid, xmlToSave);
          alert('Сохранено успешно');
        } catch (err) {
        console.error('Ошибка при сохранении dataset:', err);
        alert('Ошибка при сохранении: ' + (err.message || err));
        } finally {
        // document.getElementById('save-dataset-btn').textContent = 'Сохранить';
        // $saveBtn.prop('disabled', false);
        }
      };

      window.controller.addfinishEditing(window.finishEditing);
    //  window.toolbar = new Toolbar(null, window.finishEditing, (flag) => window.controller.setEditMode(flag), () => "");

    

    // Кнопка: выбрать модуль данных (prompt UID)

    $('#upload-btn').on('click', function () {
        $('#upload-xml').click();
    });

    $('#upload-xml').on('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (event) {
          const xmlString = event.target.result;
          window.controller.init(xmlString);
          window.controller.bindToolbar();
          window.currentDatasetUid = null;
        };
        reader.readAsText(file);
      });

    $('#download-btn').on('click', function () {
        const xmlToSave = window.controller.exportXML();
        if (!xmlToSave) {
          alert('Нет XML для выгрузки');
          return;
        }
        const blob = new Blob([xmlToSave], { type: "application/xml" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "export.xml";
        a.click();
        URL.revokeObjectURL(url);
      });

    $selectBtn.on('click', async function() {
      const uid = prompt("Введите UID модуля данных (dataset uid):");
        if (!uid) return;
        try {
        $selectBtn.prop('disabled', true).text('Загрузка...');
          const xmlString = await tcHandler.getDataset(uid);
          window.currentDatasetUid = uid;
          window.controller.init(xmlString);
          window.controller.bindToolbar();

        // Включаем кнопку Сохранить
        $saveBtn.prop('disabled', false);

        } catch (err) {
          console.error(err);
          alert('Ошибка: ' + err.message);
        } finally {
        $selectBtn.prop('disabled', false).text('Выбрать модуль данных');
        }
      });

    // Кнопка сохранить — повесим на click — она вызывает window.finishEditing через confirm в toolbar flow
    // $saveBtn.on('click', function() {
    //   // инициируем flow сохранения: показать confirm similar to edit toolbar
    //   var doSave = confirm('Отправить изменения в Teamcenter?');
    //   if (!doSave) return;
    //   // напрямую вызовем finishEditing(true)
    //   window.finishEditing(true);
    // });

    const urlParams = new URLSearchParams(window.location.search);
    const uid = urlParams.get('uid');
    if(uid){
      try {
        tcHandler.getDataset(uid)
        .then(xmlString => {
            // Инициализируем контроллер с полученным XML
            window.currentDatasetUid = uid;
          window.controller.init(xmlString);
          window.controller.bindToolbar();
        })
        .catch(error => {
            console.error('Ошибка при загрузке dataset:', error);
            $selectBtn.prop('disabled', false).text('Ошибка');
      });

        // Включаем кнопку Сохранить
        $saveBtn.prop('disabled', false);

      } catch (err) {
        console.error('Ошибка при загрузке dataset:', err);
        alert('Ошибка при загрузке данных: ' + (err.message || err));
      } finally {
        $selectBtn.prop('disabled', false).text('Выбрать модуль данных');
      }
    }

    // Если нужно — можно также позволить загрузку тестового xml при старте (удалите/закомментируйте если не нужно)
    // fetch('xmls/DMC-RRJ-A-05-34-21-00A-0B2B-A_003-00_ru-RU.xml')
    //   .then(res => res.text())
    //   .then(xmlString => {
    //       window.controller.init(xmlString);
    //       window.controller.bindToolbar();
    //       // не включаем save (т.к. нет uid)
    //   }).catch(err => console.error('Ошибка при загрузке XML:', err));
    })();
  </script>
