    <style>
        
        table { 	margin-top: 50px; 
        /* Достаточно места для фиктивных заголовков */width: 100%; 	
        min-width: 1200px;
        overflow-x: auto;
        margin-bottom: 20px; 	
        border: 2px solid #dddddd; 
        border-collapse: collapse; 
        border-color: #000000;
        box-sizing:  border-box;
        table-layout: fixed;
        }
            
        a, a:visited{
        color: #0000EE;
        }

        
        table th {	font-weight: bold;	padding: 5px;	background: #efefef;	border: 1px solid #dddddd;border-color: #000000}
        table td {
        border: 1px solid #dddddd;
        padding: 5px;
        border-color: #000000}
        .editable {
            background-color: #f9f9f9;
        }
        .edit-mode input {
            width: 100%;
            box-sizing: border-box;
        }
        .data-table.disable {
            pointer-events: none; /* Disable all mouse events */
			cursor: not-allowed;
            opacity: 0.7; /* Make the table more gray */
        }
		
		.data-table.disable p.click_style{
            pointer-events: auto; /* Disable all mouse events */
            opacity: 1; /* Make the table more gray */
			cursor: pointer;
		}
		
        .hidden-row {
            display: none;
        }
        .compressed {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .bold-header {
            font-weight: bold;
            text-align: center;
            vertical-align: middle;
        }
